<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfil - NutriCare</title>
    <link rel="icon" type="image/png" href="../../images/logo-mae.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="patient-bg">
    <header class="patient-header-glass d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light rounded-circle border text-dark shadow-sm" onclick="history.back()" style="width: 40px; height: 40px;"><i class="bi bi-arrow-left"></i></button>
            <h5 class="mb-0 fw-bold text-dark">Meu Perfil</h5>
        </div>
    </header>

    <main class="container-fluid py-4 px-3 px-md-4">
        <div class="glass-card text-center p-4 mb-4">
            <img src="https://api.dicebear.com/8.x/initials/svg?seed=Paciente" id="profileAvatar" class="rounded-circle shadow-sm border mb-3" width="80" height="80">
            <h4 class="fw-bold text-dark mb-1" id="profileName">Carregando...</h4>
            <p class="text-muted small mb-0" id="profileEmail">carregando@email.com</p>
        </div>

        <div class="list-group glass-card border-0 mb-4 shadow-sm">
            <a href="receituario.html" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 border-0">
                <i class="bi bi-capsule-pill text-success fs-5"></i>
                <span class="fw-medium text-dark">Meu Receituário</span>
                <i class="bi bi-chevron-right text-muted ms-auto"></i>
            </a>
            <a href="encaminhamentos.html" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 border-0">
                <i class="bi bi-person-lines-fill text-info fs-5"></i>
                <span class="fw-medium text-dark">Meus Encaminhamentos</span>
                <i class="bi bi-chevron-right text-muted ms-auto"></i>
            </a>
            <button class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 border-0" id="btnLogoutProfile">
                <i class="bi bi-box-arrow-right text-danger fs-5"></i>
                <span class="fw-medium text-danger">Sair do Sistema</span>
            </button>
        </div>
        
        <div class="text-center mb-5">
            <img src="../../images/logo-mae.png" width="40" class="mb-2 opacity-50">
            <br>
            <small class="text-muted opacity-50">NutriCare v1.0.0</small>
        </div>
    </main>

    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="bi bi-house-fill"></i>Início</a>
        <a href="mealPlan.html" class="nav-item"><i class="bi bi-apple"></i>Dieta</a>
        <a href="appointments.html" class="nav-item"><i class="bi bi-calendar-event"></i>Consultas</a>
        <a href="profile.html" class="nav-item active"><i class="bi bi-person-fill"></i>Perfil</a>
    </nav>

    <script type="module" src="../../js/dashboard-paciente.js"></script>
</body>
</html>
