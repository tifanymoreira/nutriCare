<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista de Compras - NutriCare</title>
    <link rel="icon" type="image/png" href="../../images/logo-mae.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="patient-bg">
    <header class="patient-header-glass d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light rounded-circle border text-dark shadow-sm" onclick="history.back()" style="width: 40px; height: 40px;"><i class="bi bi-arrow-left"></i></button>
            <h5 class="mb-0 fw-bold text-dark">Lista de Compras</h5>
        </div>
    </header>

    <main class="container-fluid py-4 px-3 px-md-4">
        <div class="glass-card p-4 mb-4">
            <h6 class="fw-bold text-dark">Gerador Automático</h6>
            <p class="small text-muted mb-3">Sua lista é gerada com base na sua dieta ativa.</p>
            <select class="form-select bg-light border-0 shadow-sm fw-bold text-primary" id="daysMultiplierSelect">
                <option value="7" selected>Para 7 Dias (Semanal)</option>
                <option value="15">Para 15 Dias (Quinzenal)</option>
                <option value="30">Para 30 Dias (Mensal)</option>
            </select>
        </div>

        <div id="shoppingListContainer">
            <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
        </div>
        <div id="emptyShoppingState" class="empty-state-card" style="display: none;">
            <div class="empty-state-icon"><i class="bi bi-cart-x"></i></div>
            <h5 class="empty-state-title">Lista Vazia</h5>
            <p class="empty-state-text">Você precisa ter um plano alimentar ativo para gerar a lista de compras.</p>
        </div>
    </main>

    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="bi bi-house-fill"></i>Início</a>
        <a href="mealPlan.html" class="nav-item"><i class="bi bi-apple"></i>Dieta</a>
        <a href="appointments.html" class="nav-item"><i class="bi bi-calendar-event"></i>Consultas</a>
        <a href="profile.html" class="nav-item"><i class="bi bi-person-fill"></i>Perfil</a>
    </nav>
    <script type="module" src="../../js/dashboard-paciente.js"></script>
</body>
</html>
