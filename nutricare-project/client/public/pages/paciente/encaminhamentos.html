<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encaminhamentos - NutriCare</title>
    <link rel="icon" type="image/png" href="../../images/logo-mae.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="patient-bg">
    <header class="patient-header-glass d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light rounded-circle border text-dark shadow-sm" onclick="history.back()" style="width:40px;height:40px;"><i class="bi bi-arrow-left"></i></button>
            <h5 class="mb-0 fw-bold text-dark">Encaminhamentos</h5>
        </div>
    </header>

    <main class="container-fluid py-4 px-3 px-md-4 mb-5">
        <p class="text-muted small mb-4">Indicações de outros profissionais feitas pela sua nutricionista.</p>

        <div id="referralsContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted fw-medium small">Carregando...</p>
            </div>
        </div>

        <div id="emptyReferrals" class="glass-card text-center p-5" style="display:none;">
            <i class="bi bi-person-lines-fill text-muted display-4 mb-3 d-block opacity-50"></i>
            <h6 class="fw-bold text-dark mb-1">Nenhum encaminhamento ainda</h6>
            <p class="text-muted small mb-0">Quando sua nutricionista indicar outro profissional (psicólogo, educador físico, etc.), o encaminhamento aparecerá aqui.</p>
        </div>
    </main>

    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="bi bi-house-fill"></i>Início</a>
        <a href="mealPlan.html" class="nav-item"><i class="bi bi-apple"></i>Dieta</a>
        <a href="appointments.html" class="nav-item"><i class="bi bi-calendar-event"></i>Consultas</a>
        <a href="profile.html" class="nav-item"><i class="bi bi-person-fill"></i>Perfil</a>
    </nav>

    <div id="systemToast" class="custom-toast"><i class="bi bi-check-circle-fill toast-icon"></i><span id="toastMessage" class="ms-2"></span></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../js/dashboard-paciente.js"></script>
</body>
</html>
