<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutri Chef AI - NutriCare</title>
    <link rel="icon" type="image/png" href="../../images/logo-mae.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="patient-bg">
    <header class="patient-header-glass d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-light rounded-circle border text-dark shadow-sm" onclick="history.back()" style="width: 40px; height: 40px;"><i class="bi bi-arrow-left"></i></button>
            <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-magic text-primary"></i> Nutri Chef AI</h5>
        </div>
    </header>

    <main class="container-fluid py-4 px-3 px-md-4">
        <div class="glass-card p-4 mb-4 text-center border-start border-4 border-primary shadow-sm">
            <h6 class="fw-bold text-dark">Cansou da mesma refeição?</h6>
            <p class="small text-muted mb-3">Escolha a refeição abaixo. Nossa IA vai criar uma receita incrível usando <strong>apenas os ingredientes</strong> permitidos na sua dieta para aquele horário!</p>
            
            <select class="form-select bg-light border-0 shadow-sm fw-bold text-primary mb-3" id="mealSelectAi">
                <option value="" selected disabled>Escolha a Refeição...</option>
                <option value="Café da Manhã">Café da Manhã</option>
                <option value="Almoço">Almoço</option>
                <option value="Lanche da Tarde">Lanche da Tarde</option>
                <option value="Jantar">Jantar</option>
            </select>
            
            <button class="btn bg-gradient-ai text-white fw-bold w-100 rounded-pill shadow-sm" id="btnGenerateAiRecipe">
                <i class="bi bi-stars"></i> Criar Receita
            </button>
        </div>

        <div id="recipeResultContainer" class="glass-card p-4 d-none mb-5">
            <div id="recipeContent"></div>
        </div>
    </main>

    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="bi bi-house-fill"></i>Início</a>
        <a href="mealPlan.html" class="nav-item"><i class="bi bi-apple"></i>Dieta</a>
        <a href="appointments.html" class="nav-item"><i class="bi bi-calendar-event"></i>Consultas</a>
        <a href="profile.html" class="nav-item"><i class="bi bi-person-fill"></i>Perfil</a>
    </nav>
    <div id="systemToast" class="custom-toast"><i class="bi bi-check-circle-fill toast-icon"></i><span id="toastMessage" class="ms-2"></span></div>
    <script type="module" src="../../js/dashboard-paciente.js"></script>
</body>
</html>
