    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Painel - NutriCare</title>
    <link rel="icon" type="image/png" href="../../images/logo-mae.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="patient-bg">
    <!-- Header Glass -->
    <header class="patient-header-glass d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <img src="https://api.dicebear.com/8.x/initials/svg?seed=Paciente" id="userAvatar" class="rounded-circle shadow-sm border" width="40" height="40" alt="Avatar">
            <div>
                <h6 class="mb-0 fw-bold text-dark lh-sm" id="greetingText">Olá, Paciente!</h6>
                <small class="text-primary fw-medium" id="headerDate">Carregando...</small>
            </div>
        </div>
        <div class="d-flex gap-2">
            <div class="notification-icon-container">
                <button class="notification-icon" id="notificationBtn">
                    <i class="bi bi-bell-fill"></i>
                    <span class="notification-badge d-none" id="notificationBadge">0</span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="dropdown-header d-flex justify-content-between">
                        <span>Notificações</span>
                    </div>
                    <div class="dropdown-body" id="notificationList">
                        <div class="p-3 text-center text-muted small">Carregando...</div>
                    </div>
                </div>
            </div>
            <button class="btn btn-light rounded-circle shadow-sm border text-danger" id="logoutBtn" style="width: 40px; height: 40px;"><i class="bi bi-box-arrow-right"></i></button>
        </div>
    </header>

    <main class="container-fluid py-4 px-3 px-md-4">
        
        <!-- Próxima Consulta Hero -->
        <div class="glass-card mb-4 p-4 highlight-appointment-card" id="nextAppointmentCard" style="display: none;">
            <div class="highlight-details">
                <i class="bi bi-calendar-heart"></i>
                <div>
                    <h5 class="highlight-title" id="nextApptTitle">Próxima Consulta</h5>
                    <p class="highlight-info mb-0" id="nextApptInfo">Carregando...</p>
                </div>
            </div>
            <div>
                <button class="btn btn-primary-custom rounded-pill shadow-sm fw-bold px-4" id="btnRescheduleNext">Remarcar</button>
            </div>
            <div class="col-6 col-md-3">
                <div class="glass-card p-3 text-center h-100">
                    <small class="text-muted fw-bold d-block mb-1 text-uppercase">Peso Atual</small>
                    <h3 class="fw-bold text-dark mb-0" id="kpiWeight">-- kg</h3>
                    <span class="badge bg-light text-muted mt-2" id="kpiWeightDiff">--</span>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="glass-card p-3 text-center h-100">
                    <small class="text-muted fw-bold d-block mb-1 text-uppercase">% Gordura</small>
                    <h3 class="fw-bold text-primary mb-0" id="kpiFat">-- %</h3>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal de Novo Agendamento / Remarcação -->
    <div class="modal fade" id="bookAppointmentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark"><i class="bi bi-calendar-plus text-primary me-2"></i> Agendar Consulta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-3">
                    <form id="bookAppointmentForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Tipo de Serviço</label>
                            <select class="form-select bg-light border-0 shadow-sm" id="bookService" required>
                                <option value="" selected disabled>Escolha o serviço...</option>
                                <option value="Primeira Consulta" data-duration="60">Primeira Consulta (60 min)</option>
                                <option value="Consulta de Retorno" data-duration="45">Consulta de Retorno (45 min)</option>
                                <option value="Acompanhamento Online" data-duration="60">Acompanhamento Online (60 min)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Data da Consulta</label>
                            <input type="date" class="form-control bg-light border-0 shadow-sm" id="bookDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Horários Disponíveis</label>
                            <div id="bookTimeSlots" class="d-flex flex-wrap gap-2">
                                <div class="text-muted small w-100 p-3 bg-light rounded text-center border border-dashed">Selecione uma data para ver os horários</div>
                            </div>
                            <input type="hidden" id="bookTime" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Motivo / Objetivo</label>
                            <textarea class="form-control bg-light border-0 shadow-sm" id="bookObjective" rows="2" placeholder="Ex: Avaliação de rotina, ajuste de dieta..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 rounded-pill fw-bold py-2" id="btnConfirmBooking">Confirmar Agendamento</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Evolução Corporal -->
    <section class="container-fluid px-3 px-md-4 mb-5" id="evolutionSection" style="display:none;">
        <div class="glass-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold text-dark mb-0"><i class="bi bi-activity text-primary me-2"></i>Minha Evolução</h6>
                <div class="d-flex gap-1 p-1 bg-light rounded-pill border" id="evolutionToggle">
                    <button class="btn btn-primary-custom btn-sm rounded-pill px-3 py-1 evo-tab active-evo" data-metric="weight">Peso</button>
                    <button class="btn btn-sm rounded-pill px-3 py-1 text-muted evo-tab" data-metric="fat">% Gordura</button>
                </div>
            </div>
            <div style="height:200px; position:relative;">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="nav-item active"><i class="bi bi-house-fill"></i>Início</a>
        <a href="mealPlan.html" class="nav-item"><i class="bi bi-apple"></i>Dieta</a>
        <a href="appointments.html" class="nav-item"><i class="bi bi-calendar-event"></i>Consultas</a>
        <a href="profile.html" class="nav-item"><i class="bi bi-person-fill"></i>Perfil</a>
    </nav>

    <div id="systemToast" class="custom-toast"><i class="bi bi-check-circle-fill toast-icon"></i><span id="toastMessage" class="ms-2"></span></div>
